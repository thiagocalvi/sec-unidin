{% extends "base.html" %}
{% block content %}
<section class="auth-card">
    <h1>UniDIN</h1>
    <p class="subtitle">Sistema de gerenciamento acadêmico</p>
    <!-- Vulnerabilidade 4 - BruteForce: rate limiting na rota login --> 
    <form method="post" action="{{ url_for('login') }}">
        <!-- Vulnerabilidade 7 - CSRF: Endpoints de Escrita --> 
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">E-mail institucional</label>
        <input id="email" name="email" type="text" placeholder="nome@universidade.br" required autofocus>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
